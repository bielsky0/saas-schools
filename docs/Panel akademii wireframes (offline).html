document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fbutton>\n      <div style=\"display:flex;gap:4px;border:1px solid hsl(var(--border));border-radius:.375rem;padding:2px;background:hsl(var(--background))\">\n        <sc-for list=\"{{ modes }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\">{{ m.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:.375rem;border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font-size:12px;font-weight:500;font-family:inherit;cursor:pointer\">\n        <i data-lucide=\"sun-moon\" style=\"width:14px;height:14px\"><\u002Fi>{{ themeLabel }}\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <span style=\"width:74px;flex:none;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:hsl(var(--muted-foreground))\">{{ g.title }}<\u002Fspan>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <sc-for list=\"{{ g.items }}\" as=\"n\" hint-placeholder-count=\"8\">\n          <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"min-height:100dvh;background:hsl(var(--background));color:hsl(var(--foreground))\">\n\n<!-- ======================= SHELL: SIDEBAR + CONTENT (admin / sekretariat / trener) ======================= -->\n<sc-if value=\"{{ vAdminShell }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:stretch;min-height:82vh\">\n\n  <aside data-screen-label=\"Sidebar\" style=\"{{ shellAside }}\">\n    <div style=\"{{ shellBrand }}\">\n      <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:.375rem;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-size:12px;font-weight:600\">AO<\u002Fspan>\n      <span style=\"{{ shellBrandText }}\">\n        <span style=\"font-size:13px;font-weight:600;line-height:1.2\">Akademia Orkan<\u002Fspan>\n        <span style=\"font-size:11px;color:hsl(var(--muted-foreground));line-height:1.2\">orkan.langlion.app<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"flex:1;overflow:hidden;padding:8px;display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ shellRows }}\" as=\"r\" hint-placeholder-count=\"22\">\n        <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"{{ r.wrap }}\">\n          <span style=\"{{ r.headerStyle }}\">{{ r.header }}<\u002Fspan>\n          <span data-icon=\"{{ r.icon }}\" style=\"{{ r.iconWrap }}\"><i data-lucide=\"{{ r.icon }}\" style=\"width:16px;height:16px\"><\u002Fi><\u002Fspan>\n          <span style=\"{{ r.labelStyle }}\">{{ r.label }}<\u002Fspan>\n          <span style=\"{{ r.countStyle }}\">{{ r.count }}<\u002Fspan>\n          <span style=\"{{ r.newStyle }}\">NOWE<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"{{ shellUser }}\">\n      <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:999px;background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));font-size:11px;font-weight:600\">{{ shellInitials }}<\u002Fspan>\n      <span style=\"{{ shellBrandText }}\">\n        <span style=\"font-size:12px;font-weight:500;line-height:1.2\">{{ shellName }}<\u002Fspan>\n        <span style=\"font-size:11px;color:hsl(var(--muted-foreground));line-height:1.2\">{{ shellRole }}<\u002Fspan>\n      <\u002Fspan>\n      <i data-lucide=\"chevrons-up-down\" style=\"width:14px;height:14px;color:hsl(var(--muted-foreground))\"><\u002Fi>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n    <header style=\"position:sticky;top:0;z-index:30;border-bottom:1px solid hsl(var(--border));background:hsl(var(--background)/.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px\">\n      <div style=\"display:flex;align-items:center;gap:10px;min-width:0\">\n        <button sc-camel-on-click=\"{{ toggleSidebar }}\" style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:.375rem;border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));cursor:pointer\"><i data-lucide=\"panel-left\" style=\"width:15px;height:15px\"><\u002Fi><\u002Fbutton>\n        <span style=\"font-size:13px;color:hsl(var(--muted-foreground))\">{{ crumbGroup }}<\u002Fspan>\n        <span style=\"font-size:13px;color:hsl(var(--muted-foreground))\">/<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ crumb }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:.375rem;border:1px solid hsl(var(--input))\">\n          <i data-lucide=\"bell\" style=\"width:15px;height:15px\"><\u002Fi>\n          <span style=\"position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:999px;background:hsl(var(--destructive))\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:.375rem;border:1px solid hsl(var(--input))\"><i data-lucide=\"sun-moon\" style=\"width:15px;height:15px\"><\u002Fi><\u002Fspan>\n        <span style=\"display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:.375rem;border:1px solid hsl(var(--input));font-size:12px;font-weight:500\">Wyloguj<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <main style=\"margin:0 auto;width:100%;max-width:66rem;padding:28px 24px 64px;display:flex;flex-direction:column;gap:32px\">\n\n\n<!-- ============ 1. DASHBOARD (główna strona akademii, /dashboard) ============ -->\n<sc-if value=\"{{ vDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"dashboard\" data-screen-label=\"Dashboard\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em\">Akademia Sportowa Orkan<\u002Fh1>\n      <p style=\"margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:hsl(var(--muted-foreground))\">\n        Twoja rola\n        <span style=\"display:inline-flex;align-items:center;border-radius:999px;border:1px solid hsl(var(--border));padding:2px 10px;font-size:11px;font-weight:500\">Właściciel<\u002Fspan>\n        <span style=\"font-family:'Geist Mono',monospace\">Europe/Warsaw<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <button style=\"display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:.375rem;border:none;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-size:14px;font-weight:500;font-family:inherit;cursor:pointer\">\n        <i data-lucide=\"plus\" style=\"width:16px;height:16px\"><\u002Fi>Dodaj zajęcia\n      <\u002Fbutton>\n      <button style=\"display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:.375rem;border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font-size:14px;font-weight:500;font-family:inherit;cursor:pointer\">\n        <i data-lucide=\"settings\" style=\"width:16px;height:16px\"><\u002Fi>Ustawienia\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showContent }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n\n    <!-- KPI -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:.625rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);padding:20px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n            <span style=\"font-size:12px;font-weight:500;color:hsl(var(--muted-foreground))\">{{ k.label }}<\u002Fspan>\n            <i data-lucide=\"{{ k.icon }}\" style=\"width:16px;height:16px;color:hsl(var(--muted-foreground))\"><\u002Fi>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:8px\">\n            <span style=\"font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fspan>\n            <span style=\"font-size:12px;color:hsl(var(--muted-foreground))\">{{ k.unit }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:12px;color:hsl(var(--muted-foreground))\">{{ k.delta }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start\">\n\n      <!-- Nadchodzące zajęcia -->\n      <div style=\"border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:.625rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 12px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h2 style=\"margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em\">Nadchodzące zajęcia<\u002Fh2>\n            <p style=\"margin:0;font-size:13px;color:hsl(var(--muted-foreground))\">Najbliższe 5 sesji · czas akademii<\u002Fp>\n          <\u002Fdiv>\n          <a href=\"#\" sc-camel-on-click=\"{{ goSchedule }}\" style=\"font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:4px\">Cały harmonogram<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto;padding:0 8px 8px\">\n          <sc-raw-table style=\"width:100%;font-size:14px\">\n            <sc-raw-thead style=\"border-bottom:1px solid hsl(var(--border))\">\n              <sc-raw-tr>\n                <sc-raw-th style=\"height:40px;padding:8px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground))\">Kiedy<\u002Fsc-raw-th>\n                <sc-raw-th style=\"height:40px;padding:8px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground))\">Grupa<\u002Fsc-raw-th>\n                <sc-raw-th style=\"height:40px;padding:8px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground))\">Trener<\u002Fsc-raw-th>\n                <sc-raw-th style=\"height:40px;padding:8px;text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground))\">Lokalizacja<\u002Fsc-raw-th>\n                <sc-raw-th style=\"height:40px;padding:8px;text-align:right;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:hsl(var(--muted-foreground))\">Akcje<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ upcoming }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <sc-raw-tr style=\"border-bottom:1px solid hsl(var(--border))\">\n                  <sc-raw-td style=\"padding:10px 8px;white-space:nowrap;font-weight:500\">{{ s.when }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 8px\">{{ s.group }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 8px;color:hsl(var(--muted-foreground))\">{{ s.trainer }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 8px;color:hsl(var(--muted-foreground))\">{{ s.location }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 8px;text-align:right\">\n                    <!-- owner, admin, secretariat, reception, trainer -->\n                    <button sc-camel-on-click=\"{{ goRoster }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:.375rem;border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap\">\n                      <i data-lucide=\"clipboard-list\" style=\"width:14px;height:14px\"><\u002Fi>Lista obecności\n                    <\u002Fbutton>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Ostatnia aktywność -->\n      <div style=\"border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:.625rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05)\">\n        <div style=\"padding:20px 20px 12px;display:flex;flex-direction:column;gap:4px\">\n          <h2 style=\"margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em\">Ostatnia aktywność<\u002Fh2>\n          <p style=\"margin:0;font-size:13px;color:hsl(var(--muted-foreground))\">5 ostatnich zmian<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding:0 20px 8px;list-style:none;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ activity }}\" as=\"a\" hint-placeholder-count=\"5\">\n            <li style=\"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid hsl(var(--border))\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:999px;background:hsl(var(--muted));color:hsl(var(--muted-foreground))\">\n                <i data-lucide=\"{{ a.icon }}\" style=\"width:14px;height:14px\"><\u002Fi>\n              <\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <span style=\"font-size:13px;line-height:1.35\">{{ a.text }}<\u002Fspan>\n                <span style=\"font-size:11px;color:hsl(var(--muted-foreground));font-family:'Geist Mono',monospace\">{{ a.time }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <!-- owner, admin -->\n        <div style=\"padding:12px 20px 20px\">\n          <a href=\"#\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:4px\">\n            <i data-lucide=\"scroll-text\" style=\"width:14px;height:14px\"><\u002Fi>Pełny audyt\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Szybkie akcje -->\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n      <sc-for list=\"{{ quickGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:.625rem;box-shadow:0 1px 2px 0 rgb(0 0 0/.05);display:flex;flex-direction:column\">\n          <div style=\"padding:20px 20px 12px;display:flex;align-items:center;gap:8px\">\n            <i data-lucide=\"{{ g.icon }}\" style=\"width:16px;height:16px;color:hsl(var(--m
